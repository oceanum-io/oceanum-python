name: Upload Python Package

on:
  release:
    types: [published]

# Same group as build-and-test.yml: this workflow runs the same production
# write tests, and publishing a release fires both workflows at once. See the
# comment there for why the group is a constant and why nothing is cancelled.
concurrency:
  group: datamesh-prod-write-tests
  cancel-in-progress: false

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    env:
      OCEANUM_TEST_DATAMESH_TOKEN: ${{ secrets.DATAMESH_TOKEN }}
    environment:
      name: pypi
      url: https://pypi.org/p/oceanum
    permissions:
      id-token: write
    steps:
    -
      name: Checkout repo
      uses: actions/checkout@v4
    -
      name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    -
      name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . --group dev
    -
      name: Test
      run: pytest -s -v tests
    -
      name: Build package
      run: |
        python -m build -s
    -
      name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
