name: Build and test the library

on:
  push:
    # Branches only. A tag ships nothing; the release that follows checks the
    # result of this workflow on the tagged commit (see pypi-publish.yml).
    branches: ['**']

# The write tests in tests/test_datamesh_write.py create, read back and delete
# datasources with fixed ids (test-write-metadata, test-write-dataset-region-
# chunked, ...) on the production datamesh. Those ids are shared global state,
# so two runs overlapping anywhere in the repo corrupt each other: one run
# registers an id the other is about to register ("data source with this id
# already exists"), or deletes one the other is midway through reading (HTTP
# 410 "deleted within your session").
#
# The group is a constant, deliberately: it must serialize across branches,
# because the contended resource is the production tenant and not the ref.
# Only this workflow runs these tests; pypi-publish.yml checks their result
# instead of re-running them.
#
# A group holds one running and one pending run: a newer pending run cancels
# the older one. A commit whose run was cancelled that way has no result until
# its run is re-run, and a release of it is refused until then.
#
# cancel-in-progress is false because cancelling a run partway through leaves
# exactly the orphaned datasources this is trying to avoid. Queue, do not kill.
concurrency:
  group: datamesh-prod-write-tests
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      OCEANUM_TEST_DATAMESH_TOKEN: ${{ secrets.DATAMESH_TOKEN }}
    steps:
    -
      name: Checkout repo
      uses: actions/checkout@v4
    -
      name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    -
      name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . --group tests
    -
      name: Test
      run: pytest -s -v tests
